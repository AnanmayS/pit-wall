[project]
name = "pitwall"
version = "0.1.0"
description = "Pit Wall: F1 telemetry coach, counterfactual race simulator, and title-odds forecaster"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastf1>=3.8,<4",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=17",
    "clickhouse-connect>=0.8",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "typer>=0.12",
    "anthropic>=1.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "boto3-stubs[dynamodb]",
]

[project.scripts]
pitwall = "pitwall.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pitwall"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs ClickHouse / DynamoDB Local running (docker compose up)",
    "network: needs internet access (FastF1 / OpenF1 / Polymarket)",
]
addopts = "-m 'not integration and not network'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
